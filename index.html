<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 교체 관리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">
    <header class="app-header">
      <h1 class="app-title">📚 수업 교체 관리</h1>
      <div class="header-actions">
        <button class="btn btn-sm" id="btn-settings">⚙ 시간표 설정</button>
        <button class="btn btn-sm btn-danger" id="btn-reset-semester">🗓 학기말 초기화</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="base">기본 시간표</button>
      <button class="tab-btn" data-tab="daily">수업 확인</button>
      <button class="tab-btn" data-tab="logs">수업 교체일지</button>
    </nav>

    <section id="panel-base" class="tab-panel active">
      <p class="panel-hint">빈 칸을 눌러 과목을 추가하고, 채워진 칸을 누르면 기본 정보를 수정하거나 삭제할 수 있어요. (요일별 반복되는 기본 시간표이며 날짜와 무관합니다)</p>
      <div id="class-bar-base" class="class-bar"></div>
      <div id="base-timetable-container"></div>
    </section>

    <section id="panel-daily" class="tab-panel">
      <p class="panel-hint">보기 날짜를 고르면 그 날에 해당하는 요일의 수업만 보여줘요. 과목을 누르면 수업을 교체할 수 있어요.</p>
      <div id="class-bar-daily" class="class-bar"></div>
      <div id="date-bar" class="date-bar"></div>
      <div id="daily-list-container"></div>
    </section>

    <section id="panel-logs" class="tab-panel">
      <div class="panel-toolbar">
        <button class="btn btn-primary btn-sm" id="btn-new-log">+ 새 일지</button>
      </div>
      <div id="log-list-container"></div>
    </section>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/constants.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/timetable.js"></script>
  <script src="js/swaplog.js"></script>
  <script src="js/swap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
